name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Rust core (test + wasm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: cargo test
        working-directory: core
        run: cargo test --all
      - name: cargo build (wasm32)
        working-directory: core
        run: cargo build --release --target wasm32-unknown-unknown

  web:
    name: Web frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # Version must match the `wasm-bindgen` dependency pinned in
      # core/Cargo.toml exactly (wasm-bindgen requires the crate and CLI
      # versions to match bit-for-bit).
      - uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: "0.2.125"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
