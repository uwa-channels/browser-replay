[package]
name = "replay-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned exact: wasm-pack requires the wasm-bindgen crate and CLI versions to
# match exactly, and CI/dev environments install the CLI separately.
wasm-bindgen = "=0.2.125"
rustfft = "6"
num-complex = "0.4"
num-traits = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
